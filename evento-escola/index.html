<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dia das experiências</title>
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
  integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
  crossorigin="anonymous">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
<main class="container py-4">
  <header class="mb-4">
    <h1>Dia das experiências</h1>
    <p>Um evento imaginado pela turma.</p>
  </header>
  <section aria-labelledby="tituloAtividades">
    <h2 id="tituloAtividades">Atividades</h2>
    <div class="row g-3">
<div class="col-12 col-md-4">
  <article class="card h-100">
    <img src="imagens/circuito.png" class="card-img-top img-fluid"
         alt="Esquema de uma pilha ligada a uma lâmpada.">
    <div class="card-body">
      <h3 class="card-title h5">Circuitos</h3>
      <p class="card-text">Descobre como acender uma lâmpada.</p>
      <a href="#perguntas" class="btn btn-primary">Saber mais</a>
    </div>
  </article>
</div>
<div class="col-12 col-md-4">
  <article class="card h-100">
    <img src="imagens/jogo.png" class="card-img-top img-fluid"
         alt="Grelha de um jogo do galo com cruzes e círculos.">
    <div class="card-body">
      <h3 class="card-title h5">Jogos</h3>
      <p class="card-text">Experimenta estratégias no jogo do galo.</p>
      <a href="#perguntas" class="btn btn-primary">Saber mais</a>
    </div>
  </article>
</div>
<div class="col-12 col-md-4">
  <article class="card h-100">
    <img src="imagens/enquadramento.png" class="card-img-top img-fluid"
         alt="Grelha de enquadramento com um círculo num dos cruzamentos.">
    <div class="card-body">
      <h3 class="card-title h5">Fotografia</h3>
      <p class="card-text">Explora diferentes formas de enquadrar uma imagem.</p>
      <a href="#perguntas" class="btn btn-primary">Saber mais</a>
    </div>
  </article>
</div>
    </div>
  </section>
  <section id="perguntas" class="mt-4">
    <h2>Perguntas frequentes</h2>
    <!-- O accordion entra aqui na atividade 2. -->
  </section>
  <section id="galeria" class="mt-4">
    <h2>Galeria</h2>
    <!-- O carrossel entra aqui na atividade 3. -->
  </section>
</main>
<!-- O JavaScript do Bootstrap entra aqui na atividade 2. -->
</body>
</html>
